services:
  postgres:
    image: postgres:17-alpine
    container_name: cardapio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cardapio
    ports:
      - '5432:5432'
    volumes:
      - cardapio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cardapio']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cardapio-pgdata:
